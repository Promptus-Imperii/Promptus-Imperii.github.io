# Taken from the hugomods/hugo:nginx image this site used before, plus long caching for
# files with a hash in their name. HTTPS and routing are done by Coolify's Caddy in front.
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    gzip on;
    gzip_comp_level 9;
    gzip_types
    text/html
    text/plain
    text/css
    text/js
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

    root /site;

    # Hugo puts a hash in the names of resized images (_hu_<hash>) and of the fingerprinted CSS
    # and JS (.min.<hash>.css). A new version gets a new name, so these can be cached for a year.
    location ~* (_hu_[0-9a-f]+\.[a-z]+|\.min\.[0-9a-f]{64}\.(css|js))$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        index index.html index.htm;
    }

    location ~* ^/([^/]+) {
        index index.html index.htm;
        error_page 404 = @error;
    }

    error_page 404 /404.html;
    location @error {
        try_files /$1/404.html /404.html =404;
    }
}
